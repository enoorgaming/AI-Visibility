# Project config: one file per brand/category you want to track.
# Run with:  py AI_Visibility.py run --project myhq

brand:
  name: myHQ
  # Every spelling that should count as a mention. Matched case-insensitively
  # as whole words, so avoid aliases that are ordinary words.
  aliases:
    - myHQ
    - myHQ by ANAROCK
    - myhq.in
  # Your own websites. Used to tag your sites in the "top cited sources" chart.
  domains:
    - myhq.in

category: coworking spaces in Bangalore

competitors:
  - name: WeWork
    aliases: [WeWork]          # not "We Work": that matches ordinary sentences
    domains: [wework.co.in, wework.com]
  - name: Awfis
    aliases: [Awfis]
    domains: [awfis.com]
  - name: Smartworks
    aliases: [Smartworks, Smart Works]
    domains: [sworks.co.in]
  - name: IndiQube
    aliases: [IndiQube]
    domains: [indiqube.com]
  - name: 91springboard
    aliases: [91springboard, 91 springboard]
    domains: [91springboard.com]
  - name: BHIVE
    aliases: [BHIVE, BHIVE Workspace]
    domains: [bhiveworkspace.com]
  - name: Cowrks
    aliases: [Cowrks]
    domains: [cowrks.com]
  - name: Innov8
    aliases: [Innov8]
    domains: [innov8.work]

# Buyer-style questions. Edit freely, or run `generate-queries` to add more.
queries:
  - What are the best coworking spaces in Bangalore?
  - Which coworking space in Bangalore is best for a startup team of 10 people?
  - Cheapest coworking day pass options in Koramangala
  - Best managed office space providers in Bangalore for a 50-seat team
  - WeWork vs Awfis vs Smartworks in Bangalore, which is better value?
  - Where can I book a meeting room by the hour in Bangalore?
  - Coworking spaces near HSR Layout with good internet and parking
  - How much does a dedicated desk cost in a Bangalore coworking space?
  - best coworking spaces in bangalore for early stage startups
  - affordable hot desk options near HSR Layout or Koramangala under 6000 a month with 24/7 access
  - Can you recommend a quiet coworking space in Indiranagar where I can just buy a day pass or book a desk for 2-3 days a week?
  - WeWork vs BHIVE in Bangalore - which one offers better value for money and community vibe?
  - How much does a dedicated private cabin for a team of 10 cost in Bangalore coworking spaces? Breakdown by area like Whitefield vs CBD.
  - Looking for enterprise managed office spaces in Bangalore for a 50-person remote-first tech team. Needs private meeting rooms and good IT infrastructure.
  - coworking space bangalore with best parking and reliable internet reviews
  - cheaper alternatives to WeWork in Bengaluru that still have decent coffee and modern interiors
  - I'm a freelancer tired of working from cafes in Bangalore. What are good flexible shared workspaces with high-speed internet and phone booths for calls?
  - 'Which coworking brand has the largest network of branches across Bangalore if I need multi-location access: Awfis or 91springboard?'
